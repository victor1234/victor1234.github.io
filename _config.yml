# About Section
about_title: About Me
about_profile_image: images/profile.jpg
about_content: |
  Senior R&D Computer Vision Engineer with over 10 years of experience and a wide range of completed projects across different domains. I have a strong ability to organize work in new areas, define research and development directions, analyze results, and make informed decisions.

  I put strong emphasis on clear solution design, unit testing, documentation, code readability, continuous integration (CI), and continuous benchmarking (CB).

  My goal is to deliver effective, user-friendly, and maintainable solutions.

  [LinkedIn activity](https://www.linkedin.com/in/victor-kataev/recent-activity/all/)

  Location: Greater Barcelona Metropolitan Area

content:
