    layout: text
    content: |
      **Programming Languages:** C++20, Python, Matlab

      **Computer Vision & Robotics:** SLAM, 3D Reconstruction, Structure-from-Motion, Bundle Adjustment, Point Clouds, Camera Calibration (multi-camera, stereo, fisheye), Photogrammetry, Sensor Fusion (Camera, IMU, LiDAR), UAV Navigation & Perception

      **Mathematics:** Linear Algebra, Nonlinear Optimization, Kalman filter, Daubechies wavelet

      **Machine Learning & Deep Learning:** scikit-learn, PyTorch, JAX

      **Frameworks & Tools:** OpenCV, Ceres Solver, GTSAM, ROS

      **MLOps:** Kubernetes, GitOps, Flux, CI/CD, Docker, GitHub Actions, Continuous Benchmarks, DevContainers, Linux

      **Build Systems & Package Managers:** CMake, Conan, vcpkg, pybind11, scikit-build

      **Additional Tools:** DLib, Blaze, Eigen, GNUPlot, Matplotlib, plotly, dash, Git, Catch2, CLion, NeoVim

