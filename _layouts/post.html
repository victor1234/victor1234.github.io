---
layout: base
---
<article class="container blog-content blog-post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <footer class="post-footer">
    {% if page.linkedin_post_url %}
      <p class="post-discussion"><a href="{{ page.linkedin_post_url | escape }}">Discuss this article on LinkedIn <span aria-hidden="true">&rarr;</span></a></p>
    {% endif %}
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a>
  </footer>
</article>
