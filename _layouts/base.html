<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body class="{% if site.darkmode == true and site.darkmode != 'never' %}dark {% endif %}{% if page.url == '/' %}home-page{% elsif page.url == '/resume/' %}resume-page{% else %}writing-page{% endif %}">
    {% unless site.darkmode == 'never' %}
      <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    {% endunless %}
    <a class="skip-link" href="#main-content">Skip to content</a>
    {%- include header.html -%}
    <main id="main-content" class="page-content" aria-label="Content" tabindex="-1">
      <div class="wrapper">
        {%- if jekyll.environment == 'production' and site.gtm -%}
          {%- include gtm_body.html -%}
        {%- endif -%}
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
